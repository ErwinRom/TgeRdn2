# =============================================================================
#  TGE RDN v2 - widoki Lovelace
# =============================================================================
#
#  Wklej jako NOWY widok (niczego nie usuwaj - stare widoki zostaja).
#
#  Tryb YAML (Plik -> Edytuj dashboard w YAML):
#      dodaj te dwa widoki do listy "views:"
#  Tryb interaktywny (karty w UI):
#      dodaj nowa karte, wklej do niej tresc jednego widoku
#      (bez sekcji "views:" i bez "type: sections" na najwyzszym poziomie)
#
#  Encje: sensor.tge_v2_* / binary_sensor.tge_v2_*
# =============================================================================

views:
  - title: Kompas Energetyczny v2
    path: kompas-energetyczny-v2
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: heading
                heading: Dzisiaj
                heading_style: title
                icon: mdi:compass-outline
              - type: markdown
                text_only: true
                content: >
                  <table role="presentation">

                  <tr>

                  <td width="44"><ha-icon
                  icon="mdi:calendar-today"></ha-icon></td>

                  <td><h1>{{ now() | as_timestamp | timestamp_custom('%d.%m.%Y',
                  local=True) }}</h1></td>

                  </tr>

                  </table>
          - type: vertical-stack
            cards:
              - type: markdown
                content: >-
                  {% macro price_cell(entity_id, hour) -%}
                    {%- set vals = state_attr(entity_id, 'fixing_i_prices') or [] -%}
                    {%- set cell = (vals | selectattr('hour', 'equalto', hour + 1) | list) | first | default(none, true) -%}
                    {%- set price = none -%}
                    {%- if cell and is_number(cell.total) -%}
                      {%- set price = cell.total | float -%}
                    {%- endif -%}
                    {%- set fg = '#9CA3AF' -%}
                  {%- if price is not none %}
                    {%- if price < 0.50 %}
                      {# Tanio, ponizej stop_above - Ciemnozielony #}
                      {%- set fg = '#236B11' %}
                    {%- elif price < 0.80 %}
                      {# Ponizej mediany - Jasnozielony/Limonkowy #}
                      {%- set fg = '#98C21D' %}
                    {%- elif price < 1.20 %}
                      {# Powyzej mediany - Zolty/Bursztynowy #}
                      {%- set fg = '#F2C433' %}
                    {%- else %}
                      {# Drogo, gorne ~15% godzin - Czerwony #}
                      {%- set fg = '#E42314' %}
                    {%- endif %}
                  {%- endif %}
                    <td align="center"
                        title="{{ '%.2f'|format(price) if price is not none else 'Brak danych' }} PLN/kWh">
                      <b>
                        <font color="{{ fg }}" size="5">
                          {{ "%02d"|format(hour) }}:00
                        </font>
                      </b>
                    </td>
                  {%- endmacro %}
                  {% set entity_id = 'sensor.tge_v2_ceny_dzis' %}
                  {% set data_fetched = state_attr(entity_id, 'data_fetched') %}
                  {% if state_attr(entity_id, 'day') is none %}
                  <center>
                    <ha-icon icon="mdi:alert-circle-outline"></ha-icon>
                    <b>Encja {{ entity_id }} niedostępna</b><br>
                    <small>Czekamy na dane z dodatku TGE RDN.</small>
                  </center>
                  {% elif data_fetched is true %}
                  <center>
                  <table border="1" cellspacing="0" cellpadding="10"
                  width="100%">
                  {% for r in range(6) %}
                    <tr>
                    {% for c in range(4) %}
                      {{ price_cell(entity_id, r * 4 + c) }}
                    {% endfor %}
                    </tr>
                  {% endfor %}
                  </table>
                  <br>
                  <small>
                  Ostatnia aktualizacja:
                  {{ states[entity_id].last_updated
                     | as_timestamp | timestamp_custom('%Y-%m-%d %H:%M:%S', local=True) }}
                  </small>
                  </center>
                  {% else %}
                  <center>
                    <b>Brak danych</b>
                  </center>
                  {% endif %}
                text_only: true
            grid_options:
              columns: 24
              rows: auto
        column_span: 1
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: heading
                heading: Jutro
                heading_style: title
                icon: mdi:weather-night-partly-cloudy
              - type: markdown
                text_only: true
                content: >
                  <table role="presentation">

                  <tr>

                  <td width="44"><ha-icon
                  icon="mdi:calendar-arrow-right"></ha-icon></td>

                  <td><h1>{{ (now() + timedelta(days=1)) | as_timestamp |
                  timestamp_custom('%d.%m.%Y', local=True) }}</h1></td>

                  </tr>

                  </table>
          - type: vertical-stack
            cards:
              - type: markdown
                content: >-
                  {% macro price_cell(entity_id, hour) -%}
                    {%- set vals = state_attr(entity_id, 'fixing_i_prices') or [] -%}
                    {%- set cell = (vals | selectattr('hour', 'equalto', hour + 1) | list) | first | default(none, true) -%}
                    {%- set price = none -%}
                    {%- if cell and is_number(cell.total) -%}
                      {%- set price = cell.total | float -%}
                    {%- endif -%}
                    {%- set fg = '#9CA3AF' -%}
                  {%- if price is not none %}
                    {%- if price < 0.50 %}
                      {%- set fg = '#236B11' %}
                    {%- elif price < 0.80 %}
                      {%- set fg = '#98C21D' %}
                    {%- elif price < 1.20 %}
                      {%- set fg = '#F2C433' %}
                    {%- else %}
                      {%- set fg = '#E42314' %}
                    {%- endif %}
                  {%- endif %}
                    <td align="center"
                        title="{{ '%.2f'|format(price) if price is not none else 'Brak danych' }} PLN/kWh">
                      <b>
                        <font color="{{ fg }}" size="5">
                          {{ "%02d"|format(hour) }}:00
                        </font>
                      </b>
                    </td>
                  {%- endmacro %}
                  {% set entity_id = 'sensor.tge_v2_ceny_jutro' %}
                  {% set data_fetched = state_attr(entity_id, 'data_fetched') %}
                  {% if state_attr(entity_id, 'day') is none %}
                  <center>
                    <ha-icon icon="mdi:alert-circle-outline"></ha-icon>
                    <b>Encja {{ entity_id }} niedostępna</b><br>
                    <small>Czekamy na dane z dodatku TGE RDN.</small>
                  </center>
                  {% elif data_fetched is true %}
                  <center>
                  <table border="1" cellspacing="0" cellpadding="10"
                  width="100%">
                  {% for r in range(6) %}
                    <tr>
                    {% for c in range(4) %}
                      {{ price_cell(entity_id, r * 4 + c) }}
                    {% endfor %}
                    </tr>
                  {% endfor %}
                  </table>
                  <br>
                  <small>
                  Ostatnia aktualizacja:
                  {{ states[entity_id].last_updated
                     | as_timestamp | timestamp_custom('%Y-%m-%d %H:%M:%S', local=True) }}
                  </small>
                  </center>
                  {% else %}
                  <center>
                    <b>Brak danych</b>
                  </center>
                  {% endif %}
                text_only: true
            grid_options:
              columns: 24
              rows: auto
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            content: >
              Cena z opłatami zmiennymi, netto (PLN/kWh):

              <font color="#236B11" size="6">&#9632;</font>&nbsp; poniżej 0,50 -
              tanio, ładowanie

              <font color="#98C21D" size="6">&#9632;</font>&nbsp; 0,50-0,80 -
              poniżej mediany

              <font color="#F2C433" size="6">&#9632;</font>&nbsp; 0,80-1,20 -
              powyżej mediany

              <font color="#E42314" size="6">&#9632;</font>&nbsp; od 1,20 -
              drogo
            text_only: true
          - type: gauge
            entity: sensor.tge_v2_aktualna_cena
            severity:
              green: 0
              yellow: 0.8
              red: 1.2
            needle: true
            max: 2
            visibility:
              - condition: state
                entity: sensor.tge_v2_aktualna_cena
                state_not:
                  - unavailable
                  - unknown
          - type: markdown
            text_only: true
            content: >
              <center><ha-icon icon="mdi:timer-sand"></ha-icon>
              <b>Aktualna cena niedostępna</b><br>
              <small>Czekamy na dane (sensor.tge_v2_aktualna_cena).</small></center>
            visibility:
              - condition: state
                entity: sensor.tge_v2_aktualna_cena
                state:
                  - unavailable
                  - unknown
          - type: markdown
            title: Plan ładowania
            content: >
              {% set plan = state_attr('sensor.tge_v2_ceny_dzis', 'plan') %}
              {% set window_ok = states('binary_sensor.tge_v2_najtansze_5h') in ['on', 'off'] %}
              {% if plan is not mapping or not window_ok %}
              <center><ha-icon icon="mdi:timer-sand"></ha-icon>
              <b>Plan ładowania niedostępny</b><br>
              <small>
              {%- if plan is not mapping %} Brak planu w sensor.tge_v2_ceny_dzis.{% endif %}
              {%- if not window_ok %} Encja binary_sensor.tge_v2_najtansze_5h niedostępna.{% endif %}
              Czekamy na dane.</small></center>
              {% else %}
              {% set periods = plan.get('periods', []) %}
              {% set charged = state_attr('binary_sensor.tge_v2_najtansze_5h', 'charged_hours') %}
              {% set missing = state_attr('binary_sensor.tge_v2_najtansze_5h', 'missing_hours') %}
              {% set in_window = is_state('binary_sensor.tge_v2_najtansze_5h', 'on') %}
              <table role="presentation" width="100%">
              <tr>
              <td>Okno ładowania:</td>
              <td><b>{{ periods | join(', ') }}</b></td>
              </tr>
              <tr>
              <td>Stan:</td>
              <td><b>{{ 'LADUJEMY' if in_window else 'poza oknem' }}</b></td>
              </tr>
              <tr>
              <td>Naładowane godziny:</td>
              <td>{{ charged | default(0, true) }} h
              {%- if missing | int(0) > 0 %} (brakuje {{ missing }}){% endif %}</td>
              </tr>
              <tr>
              <td>Najtańsza / najdroższa:</td>
              <td>{{ '%.3f'|format(plan.get('cheapest_price') | float(0)) }} /
              {{ '%.3f'|format(plan.get('dearest_price') | float(0)) }} PLN/kWh</td>
              </tr>
              <tr>
              <td>Średnia doby:</td>
              <td>{{ '%.3f'|format(plan.get('day_avg') | float(0)) }} PLN/kWh</td>
              </tr>
              <tr>
              <td>Oszczędność w oknie:</td>
              <td>{{ '%.3f'|format(plan.get('saving') | float(0)) }} PLN/kWh</td>
              </tr>
              </table>
              {% endif %}
            text_only: true
      - type: grid
        cards:
          - type: heading
            heading: Pobór prądu
            heading_style: title
          - type: gauge
            entity: sensor.shelly_em3_channel_a_current
            max: 25
            needle: false
            visibility:
              - condition: state
                entity: sensor.shelly_em3_channel_a_current
                state_not:
                  - unavailable
                  - unknown
          - type: gauge
            entity: sensor.shelly_em3_channel_b_current
            max: 25
            needle: false
            visibility:
              - condition: state
                entity: sensor.shelly_em3_channel_b_current
                state_not:
                  - unavailable
                  - unknown
          - type: gauge
            entity: sensor.shelly_em3_channel_c_current
            max: 25
            needle: false
            visibility:
              - condition: state
                entity: sensor.shelly_em3_channel_c_current
                state_not:
                  - unavailable
                  - unknown
          - type: markdown
            text_only: true
            content: >
              {% set ids = ['sensor.shelly_em3_channel_a_current',
                            'sensor.shelly_em3_channel_b_current',
                            'sensor.shelly_em3_channel_c_current'] %}
              {% set ns = namespace(bad=[]) %}
              {% for id in ids if states(id) in ['unavailable', 'unknown'] %}
              {% set ns.bad = ns.bad + [id] %}
              {% endfor %}
              {% set bad = ns.bad %}
              <center><ha-icon icon="mdi:lan-disconnect"></ha-icon>
              <b>Pomiar prądu niedostępny</b><br>
              <small>{{ bad | join(', ') }} - czekamy na dane.</small></center>
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.shelly_em3_channel_a_current
                    state: [unavailable, unknown]
                  - condition: state
                    entity: sensor.shelly_em3_channel_b_current
                    state: [unavailable, unknown]
                  - condition: state
                    entity: sensor.shelly_em3_channel_c_current
                    state: [unavailable, unknown]
    badges: []
  - title: Ceny Energii v2
    path: ceny-energii-v2
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: TGE RDN - ceny dzisiaj (z opłatami zmiennymi, netto)
            graph_span: 24h
            span:
              start: day
            yaxis:
              - min: 0
                decimals: 3
                apex_config:
                  title:
                    text: PLN/kWh
            apex_config:
              xaxis:
                labels:
                  datetimeFormatter:
                    hour: HH:mm
              plotOptions:
                bar:
                  colors:
                    ranges:
                      - from: -1000000
                        to: 0.499999
                        color: '#236B11'
                      - from: 0.5
                        to: 0.799999
                        color: '#98C21D'
                      - from: 0.8
                        to: 1.199999
                        color: '#F2C433'
                      - from: 1.2
                        to: 1000000
                        color: '#E42314'
            series:
              - entity: sensor.tge_v2_ceny_dzis
                name: Cena
                type: column
                unit: PLN/kWh
                float_precision: 3
                data_generator: |
                  const prices = entity.attributes.prices || [];

                  return prices.map((p) => [
                    new Date(p.dtime).getTime(),
                    Number(p.total_pln)
                  ]);
            visibility:
              - condition: state
                entity: sensor.tge_v2_ceny_dzis
                state_not:
                  - unavailable
                  - unknown
          - type: markdown
            text_only: true
            content: >
              <center><ha-icon icon="mdi:timer-sand"></ha-icon>
              <b>Ceny na dziś niedostępne</b><br>
              <small>sensor.tge_v2_ceny_dzis: {{ states('sensor.tge_v2_ceny_dzis') }}
              - czekamy na dane z dodatku TGE RDN.</small></center>
            visibility:
              - condition: state
                entity: sensor.tge_v2_ceny_dzis
                state:
                  - unavailable
                  - unknown
      - type: grid
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: TGE RDN - ceny jutro (z opłatami zmiennymi, netto)
            graph_span: 24h
            span:
              start: day
              offset: '+1d'
            yaxis:
              - min: 0
                decimals: 3
                apex_config:
                  title:
                    text: PLN/kWh
            apex_config:
              xaxis:
                labels:
                  datetimeFormatter:
                    hour: HH:mm
              plotOptions:
                bar:
                  colors:
                    ranges:
                      - from: -1000000
                        to: 0.499999
                        color: '#236B11'
                      - from: 0.5
                        to: 0.799999
                        color: '#98C21D'
                      - from: 0.8
                        to: 1.199999
                        color: '#F2C433'
                      - from: 1.2
                        to: 1000000
                        color: '#E42314'
            series:
              - entity: sensor.tge_v2_ceny_jutro
                name: Cena jutro
                type: column
                unit: PLN/kWh
                float_precision: 3
                data_generator: |
                  const prices = entity.attributes.prices || [];

                  return prices.map((p) => [
                    new Date(p.dtime).getTime(),
                    Number(p.total_pln)
                  ]);
            visibility:
              - condition: state
                entity: sensor.tge_v2_ceny_jutro
                state_not:
                  - unavailable
                  - unknown
          - type: markdown
            text_only: true
            content: >
              <center><ha-icon icon="mdi:timer-sand"></ha-icon>
              <b>Ceny na jutro jeszcze niedostępne</b><br>
              <small>TGE publikuje je około 12:00 - czekamy na dane
              (sensor.tge_v2_ceny_jutro: {{ states('sensor.tge_v2_ceny_jutro') }}).</small></center>
            visibility:
              - condition: state
                entity: sensor.tge_v2_ceny_jutro
                state:
                  - unavailable
                  - unknown
        column_span: 2
