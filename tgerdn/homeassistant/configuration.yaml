# =============================================================================
#  TGE RDN v2 - encje dla Home Assistant
# =============================================================================
#
#  Wklej do configuration.yaml (albo, jesli uzywasz pakietow,
#  do /config/packages/tgerdn.yaml - wtedy encje wczytaja sie
#  automatycznie przez "packages: !include_dir_named packages").
#
#  Wymagania wstępne:
#    1. Pliki JSON w /config/tgerdn/ - robi je dodatek "TGE RDN" (v2).
#    2. Automatyzacje z tgerdn__automation.yaml.
# =============================================================================

command_line:
  - sensor:
      name: "TGE RDN Cena dzis"
      unique_id: tgerdn_cena_dzis
      command: "cat /config/tgerdn/today.json"
      value_template: "{{ value_json.data_points if value_json.data_fetched else 'unknown' }}"
      scan_interval: 300
      json_attributes:
        - fixing_i_prices
        - prices
        - plan
        - tariff
        - stats
        - day
        - fetched_at
        - data_fetched
        - data_points
        - unit_of_measurement
        - friendly_name

  - sensor:
      name: "TGE RDN Cena jutro"
      unique_id: tgerdn_cena_jutro
      command: "cat /config/tgerdn/tomorrow.json"
      value_template: "{{ value_json.data_points if value_json.data_fetched else 'unknown' }}"
      scan_interval: 300
      json_attributes:
        - fixing_i_prices
        - prices
        - plan
        - tariff
        - stats
        - day
        - fetched_at
        - data_fetched
        - data_points
        - unit_of_measurement
        - friendly_name

input_number:
  - tge_ladowane_godziny:
      name: TGE Ladowane godziny
      min: 0
      max: 24
      step: 1
      unit_of_measurement: "h"
      mode: box
      icon: mdi:timer-sand

template:
  - sensor:
      # ---------------------------------------------------------------------
      # 1. Reguly - JEDNO miejsce na progi i marginesy.
      #    Zmiana taryfy to jedna edycja tego bloku.
      # ---------------------------------------------------------------------
      - name: "TGE RDN Reguly"
        unique_id: tgerdn_reguly
        state: "ok"
        attributes:
          charging_hours: 5
          charge_below: 0.2
          stop_above: 0.4
          max_charge_price: 0
          window_margin: 0.05
          day_margin: 0.28
          window_hours: [0, 1, 2, 3, 4, 5, 13, 14, 22, 23]

      # ---------------------------------------------------------------------
      # 2. Aktualna cena godziny + statystyki dnia.
      #    "total" z JSON-a to cena z marginesem dostawy (taka, ktora realnie
      #    placisz).
      # ---------------------------------------------------------------------
      - name: "TGE RDN Aktualna cena"
        unique_id: tgerdn_aktualna_cena
        unit_of_measurement: "PLN/kWh"
        state_class: measurement
        state: >
          {%- set prices = state_attr('sensor.tge_rdn_cena_dzis', 'fixing_i_prices') or [] -%}
          {%- set cur = now().hour + 1 -%}
          {%- set p = (prices | selectattr('hour', 'equalto', cur) | list) -%}
          {%- set p = p[0] if p else none -%}
          {{- p.total if p is not none else 'unavailable' -}}
        attributes:
          spot: >
            {%- set prices = state_attr('sensor.tge_rdn_cena_dzis', 'fixing_i_prices') or [] -%}
            {%- set cur = now().hour + 1 -%}
            {%- set p = (prices | selectattr('hour', 'equalto', cur) | list) -%}
            {%- set p = p[0] if p else none -%}
            {{- p.fixing_i_price_pln_kwh if p is not none else 'unavailable' -}}
          margin: >
            {%- set prices = state_attr('sensor.tge_rdn_cena_dzis', 'fixing_i_prices') or [] -%}
            {%- set cur = now().hour + 1 -%}
            {%- set p = (prices | selectattr('hour', 'equalto', cur) | list) -%}
            {%- set p = p[0] if p else none -%}
            {{- p.margin if p is not none else 'unavailable' -}}
          day: >
            {{- state_attr('sensor.tge_rdn_cena_dzis', 'day') or 'unknown' -}}
          cheapest_price: >
            {{- (state_attr('sensor.tge_rdn_cena_dzis', 'plan') or {}).get('cheapest_price', 'unavailable') -}}
          dearest_price: >
            {{- (state_attr('sensor.tge_rdn_cena_dzis', 'plan') or {}).get('dearest_price', 'unavailable') -}}
          day_avg: >
            {{- (state_attr('sensor.tge_rdn_cena_dzis', 'plan') or {}).get('day_avg', 'unavailable') -}}
          plan_hours_count: >
            {{- (state_attr('sensor.tge_rdn_cena_dzis', 'plan') or {}).get('count', 0) -}}

      # ---------------------------------------------------------------------
      # 3. Cena jutra w biezacej godzinie (do porownania z dzisiejsza).
      # ---------------------------------------------------------------------
      - name: "TGE RDN Aktualna Cena Jutro"
        unique_id: tgerdn_aktualna_cena_jutro
        unit_of_measurement: "PLN/kWh"
        state_class: measurement
        state: >
          {%- set prices = state_attr('sensor.tge_rdn_cena_jutro', 'fixing_i_prices') or [] -%}
          {%- set cur = now().hour + 1 -%}
          {%- set p = (prices | selectattr('hour', 'equalto', cur) | list) -%}
          {%- set p = p[0] if p else none -%}
          {{- p.total if p is not none else 'unavailable' -}}

  - binary_sensor:
      # ---------------------------------------------------------------------
      # 4. Czy teraz jestesmy w oknie najtańszych godzin?
      #
      #    Okno = N najtańszych godzin CALEGO dnia (liczy Python, plan jest
      #    stabilny przez dobe, wiec przelacznik nie skacze).
      #
      #    Odbudowa: jesli HA byl wylaczony w czescci okna, godziny te
      #    przepadaja. Wtedy doklejamy najtansze godziny, ktore jeszcze
      #    zostaly w ciagu dnia - dzieki temu dobowy limit N jest dotrzymany.
      # ---------------------------------------------------------------------
      - name: "TGE najtansze 5h"
        unique_id: tge_cheapest_5h_window
        device_class: power
        state: >
          {%- set rules = state_attr('sensor.tge_rdn_reguly', 'charging_hours') | int(5) -%}
          {%- set prices = state_attr('sensor.tge_rdn_cena_dzis', 'fixing_i_prices') or [] -%}
          {%- set plan = state_attr('sensor.tge_rdn_cena_dzis', 'plan') or {} -%}
          {%- set plan_hours = plan.get('hours', []) if plan is mapping else [] -%}
          {%- set cur = now().hour + 1 -%}
          {%- set future = prices | selectattr('hour', 'ge', cur) | list | sort(attribute='total') -%}
          {%- set plan_future = future | selectattr('hour', 'in', plan_hours) | list -%}
          {%- set charged = states('input_number.tge_ladowane_godziny') | float(0) | round(0) | int -%}
          {%- set missing = [rules - charged - (plan_future | length), 0] | max -%}
          {%- set extras = (future | rejectattr('hour', 'in', plan_hours) | list)[:missing] | map(attribute='hour') | list -%}
          {%- set window = plan_hours + extras -%}
          {{- cur in window -}}
        attributes:
          charged_hours: >
            {{- states('input_number.tge_ladowane_godziny') | float(0) | round(2) -}}
          window_hours: >
            {%- set prices = state_attr('sensor.tge_rdn_cena_dzis', 'fixing_i_prices') or [] -%}
            {%- set plan = state_attr('sensor.tge_rdn_cena_dzis', 'plan') or {} -%}
            {%- set plan_hours = plan.get('hours', []) if plan is mapping else [] -%}
            {%- set cur = now().hour + 1 -%}
            {%- set future = prices | selectattr('hour', 'ge', cur) | list | sort(attribute='total') -%}
            {%- set plan_future = future | selectattr('hour', 'in', plan_hours) | list -%}
            {%- set charged = states('input_number.tge_ladowane_godziny') | float(0) | round(0) | int -%}
            {%- set missing = [state_attr('sensor.tge_rdn_reguly', 'charging_hours') | int(5) - charged - (plan_future | length), 0] | max -%}
            {%- set extras = (future | rejectattr('hour', 'in', plan_hours) | list)[:missing] | map(attribute='hour') | list -%}
            {{- (plan_hours + extras) | join(',') -}}
          missing_hours: >
            {%- set prices = state_attr('sensor.tge_rdn_cena_dzis', 'fixing_i_prices') or [] -%}
            {%- set plan = state_attr('sensor.tge_rdn_cena_dzis', 'plan') or {} -%}
            {%- set plan_hours = plan.get('hours', []) if plan is mapping else [] -%}
            {%- set cur = now().hour + 1 -%}
            {%- set future = prices | selectattr('hour', 'ge', cur) | list | sort(attribute='total') -%}
            {%- set plan_future = future | selectattr('hour', 'in', plan_hours) | list -%}
            {%- set charged = states('input_number.tge_ladowane_godziny') | float(0) | round(0) | int -%}
            {{- [state_attr('sensor.tge_rdn_reguly', 'charging_hours') | int(5) - charged - (plan_future | length), 0] | max -}}
          window_count: >
            {%- set prices = state_attr('sensor.tge_rdn_cena_dzis', 'fixing_i_prices') or [] -%}
            {%- set plan = state_attr('sensor.tge_rdn_cena_dzis', 'plan') or {} -%}
            {%- set plan_hours = plan.get('hours', []) if plan is mapping else [] -%}
            {%- set cur = now().hour + 1 -%}
            {%- set future = prices | selectattr('hour', 'ge', cur) | list | sort(attribute='total') -%}
            {%- set plan_future = future | selectattr('hour', 'in', plan_hours) | list -%}
            {%- set charged = states('input_number.tge_ladowane_godziny') | float(0) | round(0) | int -%}
            {%- set missing = [state_attr('sensor.tge_rdn_reguly', 'charging_hours') | int(5) - charged - (plan_future | length), 0] | max -%}
            {%- set extras = (future | rejectattr('hour', 'in', plan_hours) | list)[:missing] | map(attribute='hour') | list -%}
            {{- (plan_hours + extras) | length -}}

      # ---------------------------------------------------------------------
      # 5. To samo dla jutra - plan na kolejna dobe.
      #    Bez odbudowy: jutro mozemy planowac dokladnie.
      # ---------------------------------------------------------------------
      - name: "TGE najtansze 5h jutro"
        unique_id: tge_najtansze_5h_jutro
        device_class: power
        state: >
          {%- set plan = state_attr('sensor.tge_rdn_cena_jutro', 'plan') or {} -%}
          {%- set plan_hours = plan.get('hours', []) if plan is mapping else [] -%}
          {%- set cur = now().hour + 1 -%}
          {{- cur in plan_hours -}}
