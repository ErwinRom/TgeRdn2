name: TGE RDN
version: "2.1.13"
slug: tgerdn
description: >-
  Pobiera ceny energii Fixing I z giełdy TGE, liczy plan ładowania auta
  (5 najtańszych godzin doby) i zapisuje pliki JSON dla Home Assistant.
url: https://github.com/ErwinRom/TgeRdn2
changelog: >
  Dodatek: pusta odpowiedz TGE nie kasuje juz dobrych danych z dzisiaj, a po
  porazce pobranie jest ponawiane (1, 2, 5, 10, 15 min). HA: wklej ponownie
  tgerdn_v2.yaml i tgerdn_v2_automation.yaml - ceny wybierane po dacie, brak
  cen nie wylacza ladowania (strazniczka wylacza po 2 h), decyzja zapada 10 s
  po pelnej godzinie, wpisy w Dzienniku z powodem. Po wklejeniu zrestartuj HA.
startup: application
boot: auto
init: false
arch:
  - amd64
  - armv7
  - armhf
  - aarch64
options:
  # Katalog na pliki JSON (musi byc w /config, zeby HA mogl je odczytac).
  output_dir: /config/tgerdn
  # Godziny pobierania cen (po przecinku), w strefie czasowej ponizej.
  hour: "00:01,12:01"
  # Ile godzin dziennie ladujemy w najtanszym oknie.
  charging_hours: 5
  # Strefa czasowa (wplywa na to, kiedy sa godziny 00:01 i 12:01).
  timezone: Europe/Warsaw
schema:
  output_dir: str
  hour: str
  charging_hours: int
  timezone: str
map:
  - type: homeassistant_config
    read_only: false
    path: /config
