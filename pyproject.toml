[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgerdn"
version = "2.0.0"
description = "Ceny energii TGE RDN dla Home Assistant - zero zaleznosci produkcyjnych"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jinja2>=3.1", "pyyaml>=6"]

[project.scripts]
tgerdn = "tgerdn.cli:main"

[tool.setuptools]
packages = ["tgerdn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
